apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: testapp1-prod-r1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: testapp1
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: testapp1-0.1.0
  name: testapp1-prod-r1
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: testapp1-prod-r1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: testapp1
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: testapp1-0.1.0
  name: testapp1-prod-r1
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/instance: testapp1-prod-r1
    app.kubernetes.io/name: testapp1
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: testapp1-prod-r1
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: testapp1
    app.kubernetes.io/version: 1.16.0
    helm.sh/chart: testapp1-0.1.0
  name: testapp1-prod-r1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: testapp1-prod-r1
      app.kubernetes.io/name: testapp1
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: testapp1-prod-r1
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: testapp1
        app.kubernetes.io/version: 1.16.0
        helm.sh/chart: testapp1-0.1.0
    spec:
      containers:
        - image: nginx:1.16.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /
              port: http
          name: testapp1
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
      serviceAccountName: testapp1-prod-r1
