apiVersion: v1
kind: Service
metadata:
  labels:
    app: testapp1-prod-r1-wordpress
    app.kubernetes.io/instance: testapp1-prod-r1
    chart: wordpress-5.0.2
    heritage: Helm
    release: testapp1-prod-r1
  name: testapp1-prod-r1-wordpress
spec:
  externalTrafficPolicy: Cluster
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
  selector:
    app: testapp1-prod-r1-wordpress
